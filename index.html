<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 아틀라스 (2026)</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #fdf5f5;
      --surface: #ffffff;
      --surface-soft: #fff1f2;
      --text: #271519;
      --muted: #8a646c;
      --border: #fce1e4;
      --primary: #e11d48;
      --primary-light: #fb7185;
      --primary-pale: #ffe4e6;
      --coral: #f97316;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(225, 29, 72, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    /* Soft Light-Red Header */
    header {
      background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 55%, #fda4af 100%);
      color: #881337;
      padding: 34px 24px 58px;
      border-bottom: 1px solid #fecdd3;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: clamp(1.5rem, 2.8vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .badge-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.65);
      color: #9f1239;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    main {
      margin-top: -32px;
      padding: 0 24px 56px;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: #881337;
      letter-spacing: -0.02em;
    }

    .kpi-value span {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
    }

    .progress-track {
      margin-top: 10px;
      height: 6px;
      background: var(--primary-pale);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fb7185, #e11d48);
      border-radius: 999px;
    }

    /* Layout Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .col-7 { grid-column: span 7; }
    .col-5 { grid-column: span 5; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }

    @media (max-width: 960px) {
      .col-7, .col-5, .col-6, .col-4 { grid-column: span 12; }
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #4c0519;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: var(--surface-soft);
      padding: 3px 10px;
      border-radius: 999px;
    }

    #map {
      width: 100%;
      height: 340px;
      border-radius: 12px;
      border: 1px solid var(--border);
      z-index: 1;
    }

    .chart-wrap {
      position: relative;
      height: 260px;
      width: 100%;
    }

    /* Compact Highlights */
    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .mini-stat {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mini-stat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    .mini-stat-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .treasure-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .t-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: #881337;
    }

    .t-pill strong {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: var(--surface);
    }

    .search-box input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.12);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .pill-btn.active, .pill-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Clean Scannable Student Cards */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .student-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 2px 10px rgba(225, 29, 72, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .student-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.09);
    }

    .student-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .student-id {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary-pale);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .student-name { font-size: 16px; font-weight: 800; color: #271519; }
    .student-loc { font-size: 12px; color: var(--muted); }

    .gender-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #f8fafc;
      color: #64748b;
      white-space: nowrap;
    }

    .gender-badge.female { background: #ffe4e6; color: #be123c; }
    .gender-badge.male { background: #e0f2fe; color: #0369a1; }
    .gender-badge.special { background: #ffedd5; color: #c2410c; }

    .hobby-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .hobby-tag {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--surface-soft);
      color: #9f1239;
    }

    .quick-info {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .quick-info b { color: var(--text); font-weight: 600; }

    .student-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .link-chip {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 8px;
      text-decoration: none;
      background: var(--surface-soft);
      color: #9f1239;
      transition: all 0.15s;
    }

    .link-chip:hover {
      background: var(--primary);
      color: #fff;
    }

    .link-chip.warn {
      background: #ffedd5;
      color: #9a3412;
      cursor: help;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12.5px;
    }
  </style>
</head>

  <header>

      <h1>🌹 우리 반 데이터 아틀라스</h1>
      <div class="badge-date">📅 2026.11 · 총 15명</div>
    </div>
  </header>

  <main class="container">

    <section class="grid-2">

        <div id="map"></div>
      </div>

      <div class="card col-5">
        <div class="card-title">
          <span>📍 권역별 인원</span>
          <span class="card-badge">의정부 최다</span>
        </div>
        <div class="chart-wrap">
          <canvas id="regionChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 3 Charts -->
    <section class="grid-2">
      <div class="card col-4">
        <div class="card-title">🎸 취미 TOP 카테고리</div>
        <div class="chart-wrap">
          <canvas id="hobbyChart"></canvas>
        </div>
      </div>

      <div class="card col-4">
        <div class="card-title">🧬 성별 응답</div>
        <div class="chart-wrap">
          <canvas id="genderChart"></canvas>
        </div>
      </div>

      <div class="card col-4">
        <div class="card-title">🚀 과제 제출률</div>
        <div class="chart-wrap">
          <canvas id="submissionChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Visual Highlights -->
    <section class="grid-2">
      <div class="card col-6">
        <div class="card-title">💎 가장 아끼는 것 요약</div>
        <div class="treasure-groups" id="treasureGroups"></div>
      </div>

      <div class="card col-6">
        <div class="card-title">✨ 한눈에 보는 포인트</div>
        <div class="highlight-grid">
          <div class="mini-stat">
            <span class="mini-stat-label">💞 반 친구 샤라웃</span>
            <span class="mini-stat-val">박준영→김보라 / 민제희→정유림</span>
          </div>
          <div class="mini-stat">
            <span class="mini-stat-label">🦕 이색 성별 응답</span>
            <span class="mini-stat-val">공룡 · 덩엉이 · 1황녀</span>
          </div>
          <div class="mini-stat">
            <span class="mini-stat-label">🎸 대세 취미</span>
            <span class="mini-stat-val">음악·악기 연주 (8명)</span>
          </div>
          <div class="mini-stat">
            <span class="mini-stat-label">🛠️ 링크 자동 정제</span>
            <span class="mini-stat-val">로컬경로 · .git · 오타 보정</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Profiles -->
    <section class="card">
      <div class="card-title">
        <span>👩‍💻 학생 프로필 (<span id="resultCount">15</span>명)</span>
      </div>

      <div class="controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="이름, 동네, 취미 검색..." />
        </div>
        <div class="filter-pills" id="filterPills">
          <button class="pill-btn active" data-filter="all">전체</button>
          <button class="pill-btn" data-filter="gyeonggi">경기도</button>
          <button class="pill-btn" data-filter="seoul">서울</button>
          <button class="pill-btn" data-filter="other">지방</button>
          <button class="pill-btn" data-filter="hasMap">지도제출</button>
        </div>
      </div>

      <div class="student-grid" id="studentGrid"></div>
    </section>
  </main>

  <footer>2026 우리 반 데이터 시각화</footer>

      { name: "최윤지", github: "https://github.com/choiyg1105-cloud", pages: "https://choiyg1105-cloud.github.io/save/", instagram: "yum._.crochet", hobby: "우쿨렐레, 뜨개질", address: "경기도 포천시", shortAddr: "포천시", regionGroup: "경기도(기타)", coords: [37.8949, 127.2003], treasure: "건강", gender: "여자", mapUrl: "https://choiyg1105-cloud.github.io/data/" },
      { name: "신단하", github: "https://github.com/danhaaaa", pages: "https://danhaaaa.github.io/sakuya/", instagram: "@danha_naa", hobby: "위시 사랑하기", address: "경기도 의정부시 신곡2동", shortAddr: "의정부 신곡2동", regionGroup: "경기도(의정부)", coords: [37.7340, 127.0680], treasure: "동생", gender: "여자", mapUrl: "" }
    ];

    function cleanUrl(url) {
      if (!url) return "";
      let u = url.trim().replace(/\s*입니다\.?$/, "");
      if (u.startsWith("github.com/")) u = "https://" + u;
      return u;
    }

    function parseInstagram(ig) {
      if (!ig) return { handle: "", url: "" };
      if (ig.startsWith("http")) {
        const m = ig.match(/instagram\.com\/([^/?]+)/);
        return { handle: m ? "@" + m[1] : "IG", url: ig };
      }
      const clean = ig.replace(/^@/, "");
      return { handle: "@" + clean, url: `https://www.instagram.com/${clean}/` };
    }

    const students = rawStudents.map(s => ({
      ...s,
      cleanGithub: cleanUrl(s.github),
      cleanPages: cleanUrl(s.pages),
      igObj: parseInstagram(s.instagram),
      isLocalMap: s.mapUrl.startsWith("file://"),
      isGitRepoMap: s.mapUrl.endsWith(".git"),
      hasWebMap: s.mapUrl.startsWith("http")
    }));

    // 1. KPI
    const total = students.length;
    const pagesCount = students.filter(s => s.cleanPages).length;
    const webMapCount = students.filter(s => s.hasWebMap).length;
    const gyeonggiCount = students.filter(s => s.regionGroup.startsWith("경기도")).length;

    const kpiData = [
      { label: "참여 인원", val: `${total}명`, sub: "GitHub 100%", pct: 100 },
      { label: "페이지 배포", val: `${Math.round(pagesCount / total * 100)}%`, sub: `${pagesCount}/${total}명`, pct: pagesCount / total * 100 },
      { label: "인물지도(웹)", val: `${Math.round(webMapCount / total * 100)}%`, sub: `${webMapCount}/${total}명`, pct: webMapCount / total * 100 },
      { label: "경기도 거주", val: `${gyeonggiCount}명`, sub: "의정부 4명", pct: gyeonggiCount / total * 100 }
    ];

    document.getElementById("kpiGrid").innerHTML = kpiData.map(k => `
      <div class="kpi-card">
        <div class="kpi-top"><span>${k.label}</span><span>${k.sub}</span></div>
        <div class="kpi-value">${k.val}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${k.pct}%"></div></div>
      </div>
    `).join("");

    // 2. Map (Soft Rose Markers)
    const map = L.map("map").setView([37.62, 127.15], 9);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    students.forEach(s => {
      const color = s.regionGroup.includes("의정부") ? "#e11d48"
        : s.regionGroup === "서울특별시" ? "#fb7185"
        : s.regionGroup === "기타 지역" ? "#f97316"
        : "#be123c";

      L.circleMarker(s.coords, {
        radius: 9,
        fillColor: color,
        color: "#ffffff",
        weight: 2.5,
        fillOpacity: 0.9
      }).addTo(map).bindPopup(`
        <div style="font-family: Pretendard, sans-serif; line-height:1.5;">
          <b style="font-size:14px; color:#881337;">${s.name}</b> · <span style="font-size:12px; color:#8a646c;">${s.shortAddr}</span><br/>
          <span style="font-size:12px;">🎯 ${s.hobby}</span>
        </div>
      `);
    });

    // 3. Charts (Rose / Coral Palette)
    Chart.defaults.font.family = "'Pretendard', sans-serif";
    Chart.defaults.color = "#8a646c";

    const rosePalette = ["#e11d48", "#fb7185", "#fda4af", "#fb923c", "#f43f5e"];

    // Region Chart
    const regionCounts = {
      "의정부": students.filter(s => s.address.includes("의정부시")).length,
      "서울": students.filter(s => s.regionGroup === "서울특별시").length,
      "경기(기타)": students.filter(s => s.regionGroup === "경기도(기타)").length,
      "춘천·거제": students.filter(s => s.regionGroup === "기타 지역").length
    };

    new Chart(document.getElementById("regionChart"), {
      type: "bar",
      data: {
        labels: Object.keys(regionCounts),
        datasets: [{
          data: Object.values(regionCounts),
          backgroundColor: ["#e11d48", "#fb7185", "#fda4af", "#fb923c"],
          borderRadius: 8,
          barThickness: 30
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: "#fff1f2" } },
          x: { grid: { display: false } }
        }
      }
    });

    // Hobby Chart
    const hobbyCat = { "음악·악기": 0, "영상·애니": 0, "게임": 0, "공예·그림·독서": 0, "운동·기타": 0 };
    students.forEach(s => {
      const h = s.hobby;
      if (/기타|노래|음악|우쿨렐레|콘서트/.test(h)) hobbyCat["음악·악기"]++;
      if (/영화|애니|공포/.test(h)) hobbyCat["영상·애니"]++;
      if (/게임|피파/.test(h)) hobbyCat["게임"]++;
      if (/그림|독서|뜨개질|인형/.test(h)) hobbyCat["공예·그림·독서"]++;
      if (/운동|자기|위시/.test(h)) hobbyCat["운동·기타"]++;
    });

    new Chart(document.getElementById("hobbyChart"), {
      type: "doughnut",
      data: {
        labels: Object.keys(hobbyCat),
        datasets: [{ data: Object.values(hobbyCat), backgroundColor: rosePalette, borderColor: "#fff", borderWidth: 2 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: "60%",
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, padding: 10, font: { size: 11.5 } } } }
      }
    });

    // Gender Chart
    const genderCat = { "여자": 0, "남자": 0, "이색 응답": 0, "미입력": 0 };
    students.forEach(s => {
      if (s.gender === "여자") genderCat["여자"]++;
      else if (s.gender === "남자") genderCat["남자"]++;
      else if (!s.gender) genderCat["미입력"]++;
      else genderCat["이색 응답"]++;
    });

    new Chart(document.getElementById("genderChart"), {
      type: "pie",
      data: {
        labels: Object.keys(genderCat),
        datasets: [{ data: Object.values(genderCat), backgroundColor: ["#fb7185", "#93c5fd", "#fdba74", "#e2e8f0"], borderColor: "#fff", borderWidth: 2 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, padding: 10, font: { size: 11.5 } } } }
      }
    });

    // Submission Chart
    const subCat = {
      "GitHub": students.filter(s => s.cleanGithub).length,
      "인스타": students.filter(s => s.igObj.url).length,
      "Pages": pagesCount,
      "지도(전체)": students.filter(s => s.mapUrl).length,
      "지도(웹)": webMapCount
    };

    new Chart(document.getElementById("submissionChart"), {
      type: "bar",
      data: {
        labels: Object.keys(subCat),
        datasets: [{ data: Object.values(subCat), backgroundColor: rosePalette, borderRadius: 6 }]
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, max: 15, ticks: { stepSize: 3 }, grid: { color: "#fff1f2" } },
          y: { grid: { display: false } }
        }
      }
    });

    // 4. Treasure Grouped Summary
    const treasureGroups = [
      { label: "👪 가족·엄마·동생", count: students.filter(s => /엄마|가족|동생/.test(s.treasure)).length },
      { label: "🙋 나 자신", count: students.filter(s => /나/.test(s.treasure)).length },
      { label: "💞 친구·최애", count: 3 },
      { label: "🐶 반려·건강", count: 2 }
    ];
    document.getElementById("treasureGroups").innerHTML = treasureGroups.map(t => `
      <span class="t-pill">${t.label} <strong>${t.count}</strong></span>
    `).join("") + students.map(s => `
      <span class="t-pill" style="background:#fff; font-size:12px; padding:5px 10px;">${s.name}: ${s.treasure}</span>
    `).join("");

    // 5. Cards
    const gridEl = document.getElementById("studentGrid");
    const countEl = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    let currentFilter = "all";

    function getGenderClass(g) {
      if (g === "여자") return "female";
      if (g === "남자") return "male";
      if (g) return "special";
      return "";
    }

    function renderCards() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = students.filter(s => {
        if (currentFilter === "gyeonggi" && !s.regionGroup.startsWith("경기도")) return false;
        if (currentFilter === "seoul" && s.regionGroup !== "서울특별시") return false;
        if (currentFilter === "other" && s.regionGroup !== "기타 지역") return false;
        if (currentFilter === "hasMap" && !s.mapUrl) return false;
        if (!q) return true;
        return `${s.name} ${s.address} ${s.hobby} ${s.treasure} ${s.gender}`.toLowerCase().includes(q);
      });

      countEl.textContent = filtered.length;

      if (!filtered.length) {
        gridEl.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:32px; color:var(--muted);">검색 결과가 없습니다.</div>`;
        return;
      }

      gridEl.innerHTML = filtered.map(s => {
        const hobbyTags = s.hobby.split(",").map(h => `<span class="hobby-tag">${h.trim()}</span>`).join("");

        const links = [
          `<a class="link-chip" href="${s.cleanGithub}" target="_blank" rel="noopener">GitHub</a>`,
          s.cleanPages ? `<a class="link-chip" href="${s.cleanPages}" target="_blank" rel="noopener">페이지</a>` : "",
          `<a class="link-chip" href="${s.igObj.url}" target="_blank" rel="noopener">IG</a>`,
          s.isLocalMap
            ? `<span class="link-chip warn" title="${s.mapUrl}">로컬파일</span>`
            : s.hasWebMap
            ? `<a class="link-chip" href="${s.mapUrl}" target="_blank" rel="noopener">${s.isGitRepoMap ? "지도(.git)" : "인물지도"}</a>`
            : ""
        ].filter(Boolean).join("");

        return `
          <article class="student-card">
            <div>
              <div class="student-top">
                <div class="student-id">
                  <div class="avatar">${s.name[0]}</div>
                  <div>
                    <div class="student-name">${s.name}</div>
                    <div class="student-loc">${s.shortAddr}</div>
                  </div>
                </div>
                ${s.gender ? `<span class="gender-badge ${getGenderClass(s.gender)}">${s.gender}</span>` : ""}
              </div>

              <div class="hobby-tags" style="margin-top: 12px;">${hobbyTags}</div>

              <div class="quick-info" style="margin-top: 10px;">
                <span>💎 <b>${s.treasure}</b></span>
                <span>· ${s.igObj.handle}</span>
              </div>
            </div>

            <div class="student-links">${links}</div>
          </article>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", renderCards);
    document.getElementById("filterPills").addEventListener("click", e => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderCards();
    });

    renderCards();
  </script>
</body>
</html>
